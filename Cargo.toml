[workspace]
resolver = "2"
members = [
    "engine",
    "selfplay",
    "bridge",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
authors    = ["El-Gabo-45"]
license    = "MIT"

[workspace.dependencies]
anyhow      = "1"
thiserror   = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
log         = "1"
env_logger  = "1"
rand        = "0.8"
bytemuck    = { version = "1", features = ["derive"] }
memmap2     = "0.9"
opencl3     = "0.10"
rayon       = "1"